<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên & Xếp loại học tập</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>QUẢN LÝ SINH VIÊN & XẾP LOẠI HỌC TẬP</h1>

        <form id="studentForm">

            <label for="studentName">Tên sinh viên:</label>
            <input type="text" id="studentName"
                   placeholder="Nhập tên sinh viên">

            <label for="math">Giải tích 1:</label>
            <input type="number" id="math"
                   min="0" max="10" step="0.01"
                   placeholder="0 - 10">

            <label for="algebra">Đại số tuyến tính:</label>
            <input type="number" id="algebra"
                   min="0" max="10" step="0.01"
                   placeholder="0 - 10">

            <label for="statistics">Xác suất thống kê:</label>
            <input type="number" id="statistics"
                   min="0" max="10" step="0.01"
                   placeholder="0 - 10">

            <label for="computer">Tin học đại cương:</label>
            <input type="number" id="computer"
                   min="0" max="10" step="0.01"
                   placeholder="0 - 10">

            <label for="web">Xây dựng ứng dụng Web:</label>
            <input type="number" id="web"
                   min="0" max="10" step="0.01"
                   placeholder="0 - 10">

            <p id="errorMessage"></p>

            <button type="submit">Tính kết quả</button>
        </form>

        <div id="result" class="result">
            <h2>KẾT QUẢ</h2>

            <p>
                <strong>Sinh viên:</strong>
                <span id="resultName"></span>
            </p>

            <table>
                <thead>
                    <tr>
                        <th>Môn học</th>
                        <th>Điểm</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Giải tích 1</td>
                        <td id="resultMath"></td>
                    </tr>

                    <tr>
                        <td>Đại số tuyến tính</td>
                        <td id="resultAlgebra"></td>
                    </tr>

                    <tr>
                        <td>Xác suất thống kê</td>
                        <td id="resultStatistics"></td>
                    </tr>

                    <tr>
                        <td>Tin học đại cương</td>
                        <td id="resultComputer"></td>
                    </tr>

                    <tr>
                        <td>Xây dựng ứng dụng Web</td>
                        <td id="resultWeb"></td>
                    </tr>
                </tbody>
            </table>

            <p class="average">
                Điểm trung bình:
                <strong id="resultAverage"></strong>
            </p>

            <p class="classification">
                Xếp loại:
                <strong id="resultClassification"></strong>
            </p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
